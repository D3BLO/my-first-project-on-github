<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرات الجعبوق والجمبلياص - مودرن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090b10;
            --card-bg: #131722;
            --primary: #ff5722;
            --secondary: #00e5ff;
            --accent: #ffd600;
            --text-main: #f4f6fb;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Intro Splash Screen */
        #intro {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1e2436 0%, #090b10 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            text-align: center;
            padding: 20px;
        }

        #intro.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-badge {
            background: rgba(255, 87, 34, 0.15);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 6px 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .intro-title {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, var(--secondary) 50%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .intro-sub {
            color: var(--text-muted);
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 35px;
        }

        .btn-enter {
            background: linear-gradient(45deg, var(--primary), #ff8a00);
            color: #fff;
            border: none;
            padding: 15px 45px;
            font-size: 1.2rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 87, 34, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-enter:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 15px 40px rgba(255, 87, 34, 0.6);
        }

        /* Topbar */
        header.topbar {
            position: sticky;
            top: 0;
            background: rgba(9, 11, 16, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: #fff;
        }

        .logo span {
            color: var(--primary);
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-right: 25px;
            font-weight: 700;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--secondary);
        }

        /* Hero Poster Section */
        .hero {
            position: relative;
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 5%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 229, 255, 0.12), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 87, 34, 0.15), transparent 40%);
        }

        .poster-container {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 40px;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 45px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }

        .tag-line {
            display: inline-block;
            background: rgba(0, 229, 255, 0.1);
            color: var(--secondary);
            padding: 5px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: clamp(2.2rem, 4vw, 3.4rem);
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero h1 .highlight {
            color: var(--accent);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .meta-info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .meta-box {
            background: rgba(255, 255, 255, 0.04);
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.95rem;
        }

        .meta-box strong {
            color: var(--secondary);
            display: block;
            font-size: 0.8rem;
        }

        .poster-art {
            position: relative;
            height: 420px;
            border-radius: 20px;
            background: linear-gradient(145deg, #1b2234, #0d1018);
            border: 2px solid rgba(255, 214, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            overflow: hidden;
        }

        .poster-art::before {
            content: "2026";
            position: absolute;
            font-size: 9rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            top: -20px;
            left: -10px;
        }

        .duo-emblem {
            font-size: 4.5rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 20px rgba(255, 214, 0, 0.4));
        }

        .poster-art h3 {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent);
        }

        .poster-art span {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 8px;
        }

        /* Sections & Cards */
        .section {
            padding: 70px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 45px;
        }

        .section-title span {
            color: var(--primary);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .char-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            transition: transform 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
        }

        .char-card:hover {
            transform: translateY(-8px);
            border-color: var(--secondary);
        }

        .char-icon {
            font-size: 2.8rem;
            margin-bottom: 15px;
        }

        .char-card h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .char-role {
            color: var(--primary);
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 12px;
            display: block;
        }

        .char-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Mini Game Box */
        .game-box {
            background: linear-gradient(145deg, #131722, #1a2030);
            border: 1px solid rgba(0, 229, 255, 0.25);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .game-choices {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .choice-btn {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .choice-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        #game-result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 12px;
            background: rgba(0, 229, 255, 0.08);
            color: var(--secondary);
            font-weight: 700;
            display: none;
        }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--secondary);
            border-radius: 24px;
            padding: 35px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .btn-action {
            background: var(--secondary);
            color: #090b10;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn-action:hover {
            opacity: 0.85;
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        @media (max-width: 850px) {
            .poster-container {
                grid-template-columns: 1fr;
                padding: 25px;
            }
            .poster-art {
                height: 300px;
            }
            nav {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Intro Screen -->
    <div id="intro">
        <div class="intro-badge">إصدار مودرن خاص • 2026</div>
        <h1 class="intro-title">مغامرات الجعبوق والجمبلياص</h1>

        <button class="btn-enter" onclick="enterSite()">ادخل عالم المغامرة 🚀</button>
    </div>

    <!-- Topbar -->
    <header class="topbar">
        <div class="logo">الجعبوق <span>&</span> الجمبلياص</div>
        <nav>
            <a href="#poster">الأفيش</a>
            <a href="#characters">الأبطال</a>
            <a href="#episodes">الحلقات</a>
            <a href="#minigame">تحدي المغامرة</a>
        </nav>
    </header>

        <div class="poster-container">
            <div class="poster-details">
                <span class="tag-line">🔥 العرض الرسمي الحصري</span>
                <h1>مغامرات <span class="highlight">الجعبوق والجمب
